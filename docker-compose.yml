# Reproducible deployment: ollama + API + UI on one isolated network.
# After the first start pull the model once:  docker compose exec ollama ollama pull qwen3:4b
# (Written for reproducibility; the submission was run natively on Windows.)
services:
  ollama:
    image: ollama/ollama:0.40.8   # same version as the local run
    volumes: [ollama-models:/root/.ollama]
  api:
    build: {context: ., dockerfile: Code/Dockerfile}
    environment: [OLLAMA_URL=http://ollama:11434]
    ports: ["127.0.0.1:8000:8000"]
    depends_on: [ollama]
  ui:
    build: {context: ., dockerfile: Code/Dockerfile}
    command: ["streamlit", "run", "app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    environment: [OLLAMA_URL=http://ollama:11434]
    ports: ["127.0.0.1:8501:8501"]
    depends_on: [ollama]
volumes:
  ollama-models:
